<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FountainJS plain DOM starter</title>
    <style>
      body { max-width: 48rem; margin: 3rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui; }
      button { font: inherit; margin: 0 0.4rem 0.8rem 0; }
      #editor { border: 1px solid #aba2b6; border-radius: 0.5rem; }
      [data-callout] { border-inline-start: 3px solid #5941bc; padding: 0.5rem 1rem; background: #f3efff; }
      details { margin-top: 1rem; }
      pre { max-height: 18rem; overflow: auto; }
    </style>
  </head>
  <body>
    <main>
      <h1>FountainJS with plain JavaScript</h1>
      <button id="callout" type="button">Insert callout</button>
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
      <div id="editor"></div>
      <details>
        <summary>Document JSON</summary>
        <pre id="document-json"></pre>
      </details>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
