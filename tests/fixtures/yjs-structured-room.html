<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open a room with structured fields</title>
<link rel="stylesheet" href="/artifacts/yjs-namespace-build-20261107/styles.css">
<style>
  body { max-width: 860px; margin: 48px auto; padding: 0 20px; font: 16px/1.5 system-ui; }
  section { margin: 20px 0; padding: 18px; border: 1px solid #cbc6dd; border-radius: 8px; }
  h2 { margin-top: 0; }
  button { padding: 8px 14px; margin: 0 8px 8px 0; }
  section .fountain-editor { min-height: 0; padding: 12px; margin-bottom: 8px; }
</style>
<h1>Open a room with structured fields</h1>
<p>Ada and Grace edit separate settings in two offline copies. Reopen the saved room to check the merged values.</p>
<button id="missing" type="button" disabled>Open without field definitions</button>
<button id="restart" type="button" disabled>Restart host without field definitions</button>
<button id="partial" type="button" disabled>Open with incomplete definitions</button>
<button id="complete" type="button" disabled>Open both authors</button>
<p id="status" role="status">Preparing the saved room…</p>
<section aria-label="Ada"><h2>Ada</h2><div id="ada"></div><button id="columns" type="button" disabled>Add a column</button></section>
<section aria-label="Grace"><h2>Grace</h2><div id="grace"></div><button id="compact" type="button" disabled>Use compact layout</button></section>
<button id="invalid" type="button" disabled>Try an invalid field update</button>
<button id="save" type="button" disabled>Save both copies and reopen</button>
<button id="switch" type="button" disabled>Load the saved revision in Ada’s editor</button>
<section aria-label="Reopened room"><h2>Reopened room</h2><div id="reopened"></div></section>
<script type="module">
  import * as Y from 'yjs';
  import { CoreExtension, EditorView, Schema, composeExtensions, createEditor, defineExtension, replaceCollaborationAdapter }
    from '/artifacts/yjs-namespace-build-20261107/engine.js';
  import { captureRetainedCheckpoint, createRetainedYjsCollaborationExtension, openYjsRoom }
    from '/artifacts/yjs-namespace-build-20261107/bound-room.js';
  import { restoreRetainedCheckpoint } from '/artifacts/yjs-namespace-build-20261107/checkpoint.js';
  import { CoordinatedDocumentRoom } from '/artifacts/yjs-namespace-build-20261107/document-room.js';
  import { defineStructuredAttribute, setStructuredAttribute }
    from '/artifacts/yjs-namespace-build-20261107/structured-attributes.js';

  const panel = defineExtension({ name: 'room-settings', nodes: { settings: {
    group: 'block', atom: true, toDOM: node => ['p', {},
      node.attrs.layout.columns + ' columns · ' + (node.attrs.layout.compact ? 'Compact' : 'Comfortable')
      + ' · ' + node.attrs.display.theme + ' theme'],
  } } });
  const layout = defineStructuredAttribute({ nodeType: 'settings', attribute: 'layout', root: 'object' });
  const display = defineStructuredAttribute({ nodeType: 'settings', attribute: 'display', root: 'object' });
  const params = new URLSearchParams(location.search);
  const mapName = params.has('custom') ? 'research-settings-fields' : undefined;
  const structuredAttributes = { definitions: [layout, display], mapName };
  const schema = new Schema(composeExtensions([CoreExtension, panel]).schema);
  const schemaVersion = 'structured-room-browser-1';
  const seed = new Y.Doc();
  const user = id => ({ id, name: id, color: '#7048e8' });
  const mount = (extension, content) => {
    const kit = composeExtensions([CoreExtension, panel, extension]);
    return createEditor({ schema: kit.schema, plugins: kit.plugins, content });
  };
  const seedEditor = mount(createRetainedYjsCollaborationExtension({ document: seed, user: user('seed'), structuredAttributes }), {
    type: 'doc', content: [{ type: 'settings', attrs: {
      nodeId: 'panel-1', layout: { columns: 2, compact: false }, display: { theme: 'light' },
    } }],
  });
  const checkpoint = await captureRetainedCheckpoint(seed, schema, schemaVersion);
  seedEditor.destroy();
  seed.destroy();
  const key = 'research-settings';
  const mixedDefinitions = params.has('mixed');
  let row;
  const repository = {
    async readDocument(roomKey) { return row?.key === roomKey ? row : undefined; },
    async createDocument(next) { if (row) return false; row = next; return true; },
    async compareDocument(roomKey, generation, next) {
      if (row?.key !== roomKey || row.generation !== generation) return false;
      row = next;
      return true;
    },
  };
  const authority = new CoordinatedDocumentRoom(repository, key, schema, schemaVersion, { structuredAttributes });
  await authority.initialize(checkpoint);
  let ada, grace, saved;
  const button = id => document.getElementById(id);
  const status = message => { document.getElementById('status').textContent = message; };
  const open = options => openYjsRoom({
      expected: { key }, schema, schemaVersion, structuredAttributes: options,
      open: async protocols => (await authority.openForEditing({ protocols, loadCheckpoint: () => checkpoint })).admission,
      admit: offer => authority.admit(offer),
  });
  const show = (shared, editor, id) => {
    const view = new EditorView(document.getElementById(id), editor, { ariaLabel: id + ' editor' });
    return { editor, view, document: shared };
  };
  const openAuthor = async id => {
    const bound = await open(structuredAttributes);
    return show(bound.document, mount(bound.createExtension({ user: user(id) }), bound.baseDocument.toJSON()), id);
  };
  button('missing').onclick = async () => {
    try {
      const bound = await open();
      bound.document.destroy();
      status('Unexpectedly opened without field definitions.');
    } catch (error) { status(error.message); }
  };
  button('restart').onclick = async () => {
    const restarted = new CoordinatedDocumentRoom(repository, key, schema, schemaVersion);
    try {
      await restarted.openForEditing({ protocols: ['retained'], loadCheckpoint: () => checkpoint });
      status('Unexpectedly opened after restarting without field definitions.');
    } catch (error) { status(error.message); }
  };
  button('partial').onclick = async () => {
    try {
      const bound = await open({ definitions: [layout], mapName });
      bound.document.destroy();
      status('Unexpectedly opened with incomplete definitions.');
    } catch (error) { status(error.message); }
  };
  button('complete').onclick = async () => {
    button('complete').disabled = true;
    button('missing').disabled = true;
    button('partial').disabled = true;
    ada = await openAuthor('ada');
    if (mixedDefinitions) {
      const saved = await restoreRetainedCheckpoint(checkpoint, schema, schemaVersion);
      const extension = createRetainedYjsCollaborationExtension({
        document: saved.document, user: user('grace'), structuredAttributes: { definitions: [layout], mapName },
      });
      grace = show(saved.document, mount(extension, saved.baseDocument.toJSON()), 'grace');
    } else grace = await openAuthor('grace');
    for (const id of ['columns', 'compact', 'invalid', 'save']) button(id).disabled = false;
    status(mixedDefinitions ? 'Grace opened a compatibility copy with fewer field definitions.' : 'Both authors opened the saved room.');
  };
  button('columns').onclick = () => setStructuredAttribute(ada.editor, [0], layout, ['columns'], 3);
  button('compact').onclick = () => setStructuredAttribute(grace.editor, [0], layout, ['compact'], true);
  button('invalid').onclick = async () => {
    button('invalid').disabled = true;
    button('save').disabled = true;
    const before = await authority.snapshot();
    const isolated = await restoreRetainedCheckpoint(before.checkpoint, schema, schemaVersion);
    try {
      const vector = Y.encodeStateVector(isolated.document);
      isolated.document.getMap(mapName ?? 'fountain:structured-attributes').set('v1:["settings","panel-1","layout"]', 'invalid');
      await authority.write({ epoch: before.epoch, protocol: before.protocol, update: Y.encodeStateAsUpdate(isolated.document, vector) });
      status('Unexpectedly saved the invalid field.');
    } catch (error) {
      if (error.code !== 'invalid-update') throw error;
      const after = await authority.snapshot();
      if (after.revision !== before.revision || after.checkpoint.manifest.checkpointSha256 !== before.checkpoint.manifest.checkpointSha256) {
        throw new Error('Rejected field update changed the saved room.');
      }
      status('Invalid field rejected. Saved room unchanged at revision ' + after.revision + '.');
    } finally {
      isolated.document.destroy();
      button('save').disabled = false;
    }
  };
  button('save').onclick = async () => {
    for (const id of ['columns', 'compact', 'invalid', 'save']) button(id).disabled = true;
    const current = await authority.snapshot();
    const vector = Y.encodeStateVectorFromUpdate(current.checkpoint.update);
    const update = Y.mergeUpdates([ada, grace].map(writer => Y.encodeStateAsUpdate(writer.document, vector)));
    const receipt = await authority.write({ epoch: current.epoch, protocol: current.protocol, update });
    saved = await openAuthor('reopened');
    button('switch').disabled = false;
    status('Saved and reopened at revision ' + receipt.revision + '.');
  };
  button('switch').onclick = async () => {
    button('switch').disabled = true;
    const next = await open(structuredAttributes);
    const previous = ada.document;
    if (!replaceCollaborationAdapter(ada.editor, () => next.createAdapter({ user: user('ada') }))) {
      next.document.destroy();
      throw new Error('Ada could not load the verified session.');
    }
    ada.document = next.document;
    previous.destroy();
    status('Ada loaded saved revision ' + next.lease.revision + ' in the same editor.');
  };
  window.addEventListener('pagehide', () => {
    for (const author of [ada, grace, saved]) {
      if (!author) continue;
      author.view.destroy();
      author.editor.destroy();
      author.document.destroy();
    }
  });
  button('partial').disabled = false;
  button('missing').disabled = false;
  button('restart').disabled = false;
  button('complete').disabled = false;
  status('Saved room ready.');
</script>
</html>
