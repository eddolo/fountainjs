worker_processes 1;
pid /tmp/fountain-nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  upstream wiki_nodes {
    server 127.0.0.1:5081 max_fails=1 fail_timeout=2s;
    server 127.0.0.1:5080 backup;
  }
  server {
    listen 127.0.0.1:5082;
    location / {
      proxy_pass http://wiki_nodes;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 2s;
      proxy_read_timeout 120s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      add_header X-Fountain-Audit-Upstream $upstream_addr always;
    }
  }
}
