<!doctype html><html lang="en"><meta charset="utf-8"><title>Native presence navigation reference</title><link rel="stylesheet" href="/src/styles.css"><style>body{font:16px system-ui;background:#f5f3ff;color:#19152f;margin:24px}#panes{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:white;border:1px solid #c5bce6;border-radius:12px;overflow:hidden}h2{padding:12px}.fountain-editor{min-height:220px;padding:24px;font-size:22px}label,select,button{font:inherit}header{margin:16px 0}</style>
<h1>Native keyboard behavior: plain editor versus remote presence</h1><header><label>Document <select id="case"></select></label> <button id="reload">Reload document</button> <label><input id="peer" type="checkbox" checked>Show peer</label> <label><input id="range-peer" type="checkbox">Peer range</label></header><div id="panes"></div>
<script type="module">
import {CoreExtension,EditorView,composeExtensions,createEditor,createCollaborationExtension} from '/src/index.ts';
const cases={english:{text:'Alpha Beta',cut:2},rtl:{text:'אבגד הוזח',cut:2,dir:'rtl'},mixed:{text:'abc אבג def',cut:4},emoji:{text:'A👩‍🔬é🇮🇹Z',cut:6},'combining-inside':{text:'A👩‍🔬é🇮🇹Z',cut:7},'zwj-inside':{text:'A👩‍🔬é🇮🇹Z',cut:3},'surrogate-inside':{text:'A👩‍🔬é🇮🇹Z',cut:2},code:{text:'first\nsecond',cut:6,type:'code_block'}};
const p=text=>({type:'paragraph',content:[{type:'text',text}]});Object.assign(cases,{empty:{text:'',cut:0},'block-gap':{document:[p('Alpha'),p('Beta')],position:7},'atomic-image':{document:[{type:'image_super',attrs:{src:'/tests/fixtures/cross-container-figure.png',alt:'Figure'}}],position:2},table:{document:[{type:'table',content:[{type:'table_row',content:[{type:'table_cell',content:[p('Cell')]}]}]}],position:5}});
let peers=[],context;const select=document.querySelector('#case'),panes=document.querySelector('#panes');for(const name of Object.keys(cases))select.add(new Option(name,name));
function presence(){const head=cases[select.value].position??cases[select.value].cut+1;context?.setPresences(document.querySelector('#peer').checked?[{clientId:'peer',user:{id:'peer',name:'Grace',color:'#d63384'},selection:{anchor:document.querySelector('#range-peer').checked?1:head,head}}]:[])}
function reload(){for(const p of peers){p.view.destroy();p.editor.destroy()}peers=[];panes.replaceChildren();const data=cases[select.value],content={type:'doc',content:data.document??[{type:data.type??'paragraph',attrs:data.dir?{dir:data.dir}:{},content:[{type:'text',text:data.text}]}]};for(const name of ['Reference','Presence']){const kit=composeExtensions([CoreExtension,...(name==='Presence'?[createCollaborationExtension({adapter:()=>({connect:value=>{context=value}})})]:[])]);const editor=createEditor({schema:kit.schema,plugins:kit.plugins,content});const section=document.createElement('section'),heading=document.createElement('h2'),mount=document.createElement('div');heading.textContent=name;section.append(heading,mount);panes.append(section);const view=new EditorView(mount,editor,{ariaLabel:name+' editor'});peers.push({editor,view})}presence()}
document.querySelector('#reload').onclick=reload;document.querySelector('#peer').onchange=presence;document.querySelector('#range-peer').onchange=presence;select.onchange=reload;
window.referenceAudit={snapshot:()=>peers.map(p=>({selection:p.editor.state.selection,json:p.editor.getJSON()}))};reload();
</script></html>
