<style>body{margin:24px;background:#f5f3ff;color:#19152f;font:16px system-ui}h1{margin-bottom:8px}.panes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}.panes>section{min-width:0;background:white;border:1px solid #c5bce6;border-radius:12px;overflow:hidden}h2{font-size:19px;padding:16px;margin:0}header{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px}button{font:inherit;padding:7px;border:1px solid #c5bce6;border-radius:6px;background:white;cursor:pointer}pre{padding:12px;margin:0 16px 12px;min-height:48px;background:#efecfa;white-space:pre-wrap;overflow-wrap:anywhere;font:13px monospace}.fountain-editor{min-height:360px;padding:20px}.fountain-editor img{max-width:100%;max-height:85px;object-fit:contain}#message{min-height:30px}</style>
<h1>Join the shared paper without losing a draft</h1><p>Actual HTTP + Node/SQLite room. Admission validates the checkpoint before the provider connects.</p><p id="message" role="status">Opening…</p>
<div class="panes"><section id="left"><h2>Left author</h2><header></header><pre></pre></section><section id="right"><h2>Right author</h2><header></header><pre></pre></section><section id="server"><h2>Saved document · reader</h2><header><button id="refresh-server">Refresh saved document</button></header><pre></pre></section></div>
<script type="module">

const encode=value=>JSON.stringify(value,(_key,value)=>value instanceof Uint8Array?{__wire:btoa(String.fromCharCode(...value))}:value),decode=text=>JSON.parse(text,(_key,value)=>value&&typeof value==='object'&&Object.keys(value).length===1&&typeof value.__wire==='string'?Uint8Array.from(atob(value.__wire),c=>c.charCodeAt(0)):value);

({token}=await request('open'));const initialDoc=new Y.Doc(),seedKit=composeExtensions([CoreExtension,MathExtension,createRetainedYjsCollaborationExtension({document:initialDoc,user:{id:'authority',name:'Authority',color:'#7048e8'}})]),seed=createEditor({schema:seedKit.schema,plugins:seedKit.plugins,content:base});try{current=await request('initialize',{checkpoint:await captureRetainedCheckpoint(initialDoc,seed.state.schema,version)});}finally{seed.destroy();initialDoc.destroy();}

</script></html>
