<!doctype html><html lang="en"><meta charset="utf-8"><title>Retained checkpoint audit</title>
<link rel="stylesheet" href="/src/styles.css">
<style>body{margin:24px;background:#f5f3ff;color:#19152f;font:16px system-ui}h1{margin-bottom:8px}button{font:inherit;padding:8px 12px;border:1px solid #c5bce6;border-radius:6px;background:white;cursor:pointer}header{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#panes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}section{min-width:0;background:white;border:1px solid #c5bce6;border-radius:12px;overflow:hidden}h2,pre{padding:16px;margin:0}pre{display:block;max-height:220px;overflow:auto;font:13px monospace;background:#efecfa;white-space:pre-wrap}.fountain-editor{min-height:300px;padding:24px}.fountain-editor img{max-width:100%;max-height:130px;object-fit:contain}#message{min-height:28px;margin:18px 0}label{display:flex;gap:6px;align-items:center}#empty{padding:24px}</style>
<h1>Shared checkpoint — internal audit</h1><p>Full Yjs rollback snapshot. Isolated restore; no compaction, history restoration or new-room migration.</p>
<header><button id="capture">Capture checkpoint</button><button id="restore" disabled>Restore snapshot</button><button id="apply" disabled>Apply current source updates</button><button id="note">Add host note</button><button id="damage" disabled>Test damaged snapshot</button><label><input id="race" type="checkbox">Simulate write during capture</label></header>
<div id="message" role="status">Ready</div><div id="panes"><section id="source"><h2>Source · live editor</h2></section><section id="restored"><h2>Restored · isolated checkpoint</h2><div id="empty">Capture, then restore to inspect the snapshot.</div></section></div>
<script type="module">
import * as Y from 'yjs';
import {CoreExtension,Plugin,EditorView,composeExtensions,createEditor,getCollaborationState,undoCollaboration,redoCollaboration} from '/src/index.ts';
import {createRetainedYjsCollaborationExtension} from '/src/yjs/retained-adapter.ts';
import {captureRetainedCheckpoint,restoreRetainedCheckpoint} from '/src/yjs/retained-checkpoint.ts';
const message=document.querySelector('#message'),content={type:'doc',attrs:{title:'Checkpoint audit'},content:[{type:'paragraph',attrs:{nodeId:'intro'},content:[{type:'text',text:'Alpha'}]},{type:'image_super',attrs:{nodeId:'figure',src:'/tests/fixtures/cross-container-figure.png',alt:'Retained figure'}}]};
const shortcuts=new Plugin({props:{handleKeyDown:(editor,event)=>{if(event.altKey||event.isComposing||!(event.ctrlKey||event.metaKey)||!['z','y'].includes(event.key.toLowerCase()))return false;return event.key.toLowerCase()==='y'||event.shiftKey?redoCollaboration(editor):undoCollaboration(editor)}}});
let source,restored,checkpoint,noteCount=1;
function snapshot(peer){const notes=peer.doc.getMap('host-notes'),anchor=notes.get('anchor'),point=anchor&&Y.createAbsolutePositionFromRelativePosition(Y.createRelativePositionFromJSON(anchor),peer.doc);return {json:peer.editor.getJSON(),status:getCollaborationState(peer.editor)?.status,notes:notes.get('count'),anchorIndex:point?.index??null}}
function show(peer){peer.output.textContent=JSON.stringify(snapshot(peer),null,2)}
function mount(doc,id){const section=document.querySelector('#'+id);section.querySelector('#empty')?.remove();const mount=document.createElement('div'),output=document.createElement('pre');section.append(mount,output);const kit=composeExtensions([CoreExtension,createRetainedYjsCollaborationExtension({document:doc,captureTimeout:0,user:{id,name:id,color:'#7048e8'}})]),editor=createEditor({schema:kit.schema,plugins:[...kit.plugins,shortcuts],content}),view=new EditorView(mount,editor,{ariaLabel:id==='source'?'Source editor':'Restored editor'}),peer={doc,editor,view,mount,output};editor.subscribe(()=>show(peer));show(peer);return peer}
source=mount(new Y.Doc(),'source');const notes=source.doc.getMap('host-notes');notes.set('count',noteCount);notes.set('bytes',new Uint8Array([0,128,255]));const text=[...source.doc.getMap('fountain-text:texts').values()][0];notes.set('anchor',Y.relativePositionToJSON(Y.createRelativePositionFromTypeIndex(text,3,1)));source.doc.getArray('empty-host-list');show(source);
document.querySelector('#capture').onclick=async()=>{try{const pending=captureRetainedCheckpoint(source.doc,source.editor.state.schema,'audit-schema-1');if(document.querySelector('#race').checked){notes.set('count',++noteCount);show(source)}const value=await pending;checkpoint=value;document.querySelector('#restore').disabled=false;document.querySelector('#damage').disabled=false;message.textContent=`Checkpoint captured · ${value.manifest.bytes} bytes`}catch(error){message.textContent='Capture failed: '+error.message}};
document.querySelector('#restore').onclick=async()=>{try{const value=await restoreRetainedCheckpoint(checkpoint,source.editor.state.schema,'audit-schema-1');if(restored){restored.view.destroy();restored.editor.destroy();restored.doc.destroy();restored.mount.remove();restored.output.remove()}restored=mount(value.document,'restored');document.querySelector('#apply').disabled=false;message.textContent='Checkpoint restored into an isolated document';show(source)}catch(error){message.textContent='Restore failed: '+error.message}};
document.querySelector('#apply').onclick=()=>{Y.applyUpdate(restored.doc,Y.encodeStateAsUpdate(source.doc),'source-update');show(restored);message.textContent='Same-room source updates applied'};
document.querySelector('#note').onclick=()=>{notes.set('count',++noteCount);show(source);message.textContent='Host note added'};
document.querySelector('#damage').onclick=async()=>{const update=checkpoint.update;update.fill(0);try{const value=await restoreRetainedCheckpoint({manifest:checkpoint.manifest,update},source.editor.state.schema,'audit-schema-1');value.document.destroy();message.textContent='Unexpectedly accepted damaged data'}catch(error){message.textContent='Damaged snapshot rejected: '+error.message}};
window.audit={snapshot:()=>({source:snapshot(source),restored:restored?snapshot(restored):null}),checkpoint:()=>checkpoint?.manifest};
</script></html>
