<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collaboration repair audit</title>
<link rel="stylesheet" href="/artifacts/retained-repair-build-20261107/styles.css">
<style>body{font-family:Arial,sans-serif;margin:24px;background:#f7f5ff;color:#17152b}h1{font-size:28px}button{padding:10px;border:1px solid #b8a9fa;border-radius:6px;background:white;color:inherit}button:disabled{opacity:.5}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.panes{display:grid;grid-template-columns:1fr 1fr;gap:16px}section{min-width:0;border:1px solid #c9baff;border-radius:10px;background:white;padding:16px}section h2{font-size:20px}.editor{min-height:320px}output{display:block;padding:10px;background:#f5f2ff;font-family:monospace;white-space:pre-wrap;overflow-wrap:anywhere}.fountain-editor{padding:18px}#status{padding:12px}img{max-width:100%}</style>
<h1>Shared document repairs without duplicate edits</h1><p>The right editor assigns stable IDs and keeps a final editable paragraph. Both use the experimental retained adapter.</p>
<div class="toolbar"><button id="pause">Pause synchronization</button><button id="sync">Synchronize now</button></div><p id="status" role="status">Opening</p>
<div class="panes"><section id="plain"><h2>Author without repair extensions</h2><div class="toolbar"><button id="duplicate">Duplicate first paragraph</button><button id="divider">Append divider</button><button id="plain-undo">Undo author</button><button id="plain-redo">Redo author</button></div><div id="plain-editor" class="editor"></div><output id="plain-output" role="note"></output></section>
<section id="stable"><h2>Author with automatic repairs</h2><div class="toolbar"><button id="stable-duplicate">Duplicate reviewer paragraph</button><button id="stable-divider">Append reviewer divider</button><button id="stable-undo">Undo reviewer</button><button id="stable-redo">Redo reviewer</button></div><div id="stable-editor" class="editor"></div><output id="stable-output" role="note"></output></section></div>
<script type="module">
import * as Y from 'yjs';
import {CoreExtension,EditorView,composeExtensions,createEditor,createCollaborationExtension,createTrailingEditableBlockExtension,getCollaborationState,canUndoCollaboration,canRedoCollaboration,undoCollaboration,redoCollaboration,closeCollaborationHistory} from '/artifacts/retained-repair-build-20261107/engine.js';
import {createStableNodeIdsExtension,inspectStableNodeIds} from '/artifacts/retained-repair-build-20261107/node-ids.js';
import {RetainedYjsCollaborationAdapter} from '/artifacts/retained-repair-build-20261107/retained-adapter.js';
const initial={type:'doc',content:[{type:'paragraph',attrs:{nodeId:'intro'},content:[{type:'text',text:'Shared incident note.'}]},{type:'paragraph',attrs:{nodeId:'tail'},content:[{type:'text',text:'Keep the recovery plan editable.'}]}]};
const message=document.querySelector('#status'),peers=[];let linked=true,exchanging=false;
function status(){for(const p of peers){document.querySelector('#'+p.id+'-output').textContent=JSON.stringify({status:getCollaborationState(p.editor)?.status,blocks:p.editor.state.doc.childCount,ids:p.editor.state.doc.content.map(n=>n.attrs.nodeId),issues:inspectStableNodeIds(p.editor.state.doc).length},null,2);document.querySelector('#'+p.id+'-undo').disabled=!canUndoCollaboration(p.editor);document.querySelector('#'+p.id+'-redo').disabled=!canRedoCollaboration(p.editor);}}
function sync(){if(exchanging||peers.length!==2)return;exchanging=true;try{const [a,b]=peers;Y.applyUpdate(b.doc,Y.encodeStateAsUpdate(a.doc),'exchange');Y.applyUpdate(a.doc,Y.encodeStateAsUpdate(b.doc),'exchange');status();}finally{exchanging=false;}}
for(const id of ['plain','stable']){const doc=new Y.Doc();if(peers.length)Y.applyUpdate(doc,Y.encodeStateAsUpdate(peers[0].doc),'seed');const kit=composeExtensions([CoreExtension,...(id==='stable'?[createStableNodeIdsExtension(),createTrailingEditableBlockExtension()]:[]),createCollaborationExtension({adapter:()=>new RetainedYjsCollaborationAdapter({document:doc,captureTimeout:500,user:{id,name:id,color:'#7048e8'}})})]);const editor=createEditor({schema:kit.schema,plugins:kit.plugins,content:initial});const view=new EditorView(document.querySelector('#'+id+'-editor'),editor,{ariaLabel:id==='plain'?'Author editor':'Reviewer editor'});peers.push({id,doc,editor,view});editor.subscribe(status);doc.on('update',()=>{if(linked)sync();});}
document.querySelector('#pause').onclick=()=>{linked=false;message.textContent='Synchronization paused — edit independently';};
document.querySelector('#sync').onclick=()=>{sync();linked=true;message.textContent='Synchronized — repairs remain history-neutral';};
document.querySelector('#duplicate').onclick=()=>{const p=peers[0];closeCollaborationHistory(p.editor);p.editor.dispatch(p.editor.createTransaction().replace(1,1,[p.editor.state.doc.child(0)]));closeCollaborationHistory(p.editor);sync();message.textContent='Paragraph duplicated — repaired IDs shared';};
document.querySelector('#divider').onclick=()=>{const p=peers[0];closeCollaborationHistory(p.editor);const node=p.editor.state.schema.nodeFromJSON({type:'horizontal_rule',attrs:{nodeId:'incident-divider'}});p.editor.dispatch(p.editor.createTransaction().replace(p.editor.state.doc.childCount,p.editor.state.doc.childCount,[node]));closeCollaborationHistory(p.editor);sync();message.textContent='Divider added — peer supplied a final editable paragraph';};
for(const kind of ['duplicate','divider'])document.querySelector('#stable-'+kind).onclick=()=>{const p=peers[1];closeCollaborationHistory(p.editor);const node=kind==='duplicate'?p.editor.state.doc.child(0):p.editor.state.schema.node('horizontal_rule'),index=kind==='duplicate'?1:p.editor.state.doc.childCount;p.editor.dispatch(p.editor.createTransaction().replace(index,index,[node]));closeCollaborationHistory(p.editor);sync();message.textContent='Reviewer action and automatic repairs shared';};
for(const p of peers)for(const action of ['undo','redo'])document.querySelector('#'+p.id+'-'+action).onclick=()=>{(action==='undo'?undoCollaboration:redoCollaboration)(p.editor);sync();status();};
window.audit={snapshot:()=>peers.map(p=>({id:p.id,json:p.editor.getJSON(),status:getCollaborationState(p.editor),issues:inspectStableNodeIds(p.editor.state.doc),canUndo:canUndoCollaboration(p.editor),canRedo:canRedoCollaboration(p.editor)}))};
status();message.textContent='Ready';
</script></html>
