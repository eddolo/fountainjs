<!doctype html><html lang="en"><meta charset="utf-8"><title>Fresh-room migration candidate audit</title><link rel="stylesheet" href="/src/styles.css">
<style>body{margin:24px;background:#f5f3ff;color:#19152f;font:16px system-ui}button{font:inherit;padding:8px 12px;border:1px solid #c5bce6;border-radius:6px;background:white;cursor:pointer}header{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.panes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}section{min-width:0;background:white;border:1px solid #c5bce6;border-radius:12px;overflow:hidden}h2,pre{padding:16px;margin:0}pre{max-height:180px;overflow:auto;font:13px monospace;background:#efecfa;white-space:pre-wrap}.fountain-editor{min-height:260px;padding:24px}.fountain-editor img{max-width:100%;max-height:100px;object-fit:contain}#message{min-height:28px;margin:18px 0}.panel{padding:12px;border:1px solid #b9ddcb;background:#effaf4}label{display:flex;gap:6px;align-items:center}</style>
<h1>Fresh room · isolated candidate audit</h1><p>Translate references and preserve document values. No authoritative activation, offline reconciliation or history transfer.</p>
<header><button id="save">Save writer selection</button><button id="build">Build candidate preview</button><button id="select" disabled>Select saved range in preview</button><button id="stale" disabled>Check old-room wire rejection</button><button id="unknown">Add unclaimed host root</button><label><input id="bad" type="checkbox">Simulate verifier write</label></header>
<div id="message" role="status">Opening…</div><pre id="report"></pre><div class="panes"><section id="source"><h2>Source · original room</h2></section><section id="preview"><h2>Preview · fresh room, isolated</h2></section></div>
<script type="module">
import * as Y from 'yjs';
import {CoreExtension,MathExtension,Plugin,EditorView,composeExtensions,createEditor,defineExtension,getCollaborationState,undoCollaboration,redoCollaboration} from '/src/index.ts';
import {createRetainedYjsCollaborationExtension} from '/src/yjs/retained-adapter.ts';
import {captureRetainedCheckpoint,restoreRetainedCheckpoint} from '/src/yjs/retained-checkpoint.ts';
import {applyRetainedRoomUpdate} from '/src/yjs/retained-room-store.ts';
import {buildRetainedMigrationCandidate,retainedSelectionRootMigrator} from '/src/yjs/retained-migration.ts';
import {retainSelection,restoreSelection} from '/src/yjs/retained-selection.ts';
import {RetainedDocumentStore} from '/src/yjs/retained-document.ts';
const content={type:'doc',attrs:{title:'Migration note'},content:[{type:'paragraph',attrs:{nodeId:'intro'},content:[{type:'text',text:'Alpha technical note.'}]},{type:'blockquote',content:[{type:'paragraph',content:[{type:'text',text:'A selected phrase must retain its exact range.'}]}]},{type:'image_super',attrs:{nodeId:'figure',src:'/tests/fixtures/cross-container-figure.png',alt:'Retained figure'}},{type:'math_block',attrs:{latex:'x^2+y^2',label:'eq:one'}},{type:'code_block',attrs:{language:'lean'},content:[{type:'text',text:'example : 1 + 1 = 2 := by decide'}]}]};
const shortcuts=new Plugin({props:{handleKeyDown:(editor,event)=>{if(event.altKey||event.isComposing||!(event.ctrlKey||event.metaKey)||!['z','y'].includes(event.key.toLowerCase()))return false;return event.key.toLowerCase()==='y'||event.shiftKey?redoCollaboration(editor):undoCollaboration(editor)}}});
function mount(doc,id){const host=document.createElement('div');document.querySelector('#'+id).append(host);const kit=composeExtensions([CoreExtension,MathExtension,createRetainedYjsCollaborationExtension({document:doc,captureTimeout:0,user:{id,name:id,color:'#7048e8'}})]),editor=createEditor({schema:kit.schema,plugins:[...kit.plugins,shortcuts],content}),view=new EditorView(host,editor,{ariaLabel:id==='source'?'Source editor':'Candidate editor'}),reader=new RetainedDocumentStore(doc,'fountain',editor.state.schema,()=>{throw new Error('No allocation')});reader.read();return {doc,host,editor,view,reader}}
const source=mount(new Y.Doc(),'source');source.doc.getMap('saved-selections');let preview,candidate;
const message=document.querySelector('#message');
function action(id,run){document.querySelector('#'+id).onclick=async()=>{try{await run()}catch(error){message.textContent='Rejected: '+error.message}}}
action('save',()=>{source.reader.read();source.doc.getMap('saved-selections').set('review',retainSelection(source.reader,source.editor.state.doc,source.editor.state.selection));message.textContent='Writer selection saved'});
action('build',async()=>{const checkpoint=await captureRetainedCheckpoint(source.doc,source.editor.state.schema,'audit-schema-1'),migrator=retainedSelectionRootMigrator('saved-selections');if(document.querySelector('#bad').checked){const original=migrator.verify;migrator.verify=context=>{original(context);context.target.getMap('saved-selections').set('unexpected-write',true)}}const value=await buildRetainedMigrationCandidate(checkpoint,source.editor.state.schema,'audit-schema-1',{history:'reset-with-source-checkpoint',offline:'reconcile-before-activation',externalState:'host-coordinated',migrators:[migrator]});const restored=await restoreRetainedCheckpoint(value.destination,source.editor.state.schema,'audit-schema-1');if(preview){preview.reader.destroy();preview.view.destroy();preview.editor.destroy();preview.doc.destroy();preview.host.remove()}preview=mount(restored.document,'preview');candidate=value;document.querySelector('#report').textContent=JSON.stringify(value.report,null,2);document.querySelector('#select').disabled=!preview.doc.getMap('saved-selections').has('review');document.querySelector('#stale').disabled=false;message.textContent='Candidate preview ready · fresh identity, same document'});
action('select',()=>{preview.reader.read();const selection=restoreSelection(preview.reader,preview.editor.state.doc,preview.doc.getMap('saved-selections').get('review'));if(!selection)throw new Error('Saved selection detached');preview.editor.dispatch(preview.editor.createTransaction().setSelection(selection));preview.view.focus();message.textContent='Saved range selected in fresh preview'});
action('stale',async()=>{try{await applyRetainedRoomUpdate(candidate.destination,source.editor.state.schema,'audit-schema-1',Y.encodeStateAsUpdate(source.doc));throw new Error('Unexpected old-room acceptance')}catch(error){if(error.code!=='invalid-update')throw error;message.textContent='Old-room wire rejected in isolation; preview unchanged'}});
action('unknown',()=>{source.doc.getMap('unclaimed-host-data').set('note','Preserve or explicitly translate this');message.textContent='Unclaimed host root added to source'});
window.audit={snapshot:()=>({source:source.editor.getJSON(),preview:preview?.editor.getJSON(),sourceStatus:getCollaborationState(source.editor)?.status,previewStatus:preview?getCollaborationState(preview.editor)?.status:null,report:candidate?.report,sourceRoomId:candidate?.source.manifest.roomId,previewRoomId:candidate?.destination.manifest.roomId}),report:()=>candidate?.report};
message.textContent='Ready · edit the source, save a selection, then build a candidate';
</script></html>
