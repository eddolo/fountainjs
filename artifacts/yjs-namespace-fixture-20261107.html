<style>body{margin:24px;background:#f5f3ff;color:#19152f;font:16px system-ui}h1{margin-bottom:8px}button,select{font:inherit;padding:8px 10px;border:1px solid #c5bce6;border-radius:6px;background:white}button{cursor:pointer}header{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.panes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}.panes>section{min-width:0;background:white;border:1px solid #c5bce6;border-radius:12px;overflow:hidden}h2{font-size:19px;padding:16px;margin:0}pre{padding:12px;margin:12px 0;max-height:180px;overflow:auto;font:13px monospace;background:#efecfa;white-space:pre-wrap}.fountain-editor{min-height:440px;padding:20px}.fountain-editor img{max-width:100%;max-height:90px;object-fit:contain}#message{min-height:28px;margin:18px 0}label{display:flex;gap:6px;align-items:center}</style>
<h1>Live protocol migration · recoverable handoff</h1><p>Actual Node/SQLite authority. Legacy → retained → legacy. Pending old-protocol edits stay separately recoverable.</p>
<header><button id="retained-only">Try retained-only join</button><label>Retained destination namespace <input id="destination" value="mapped-paper" aria-label="Retained destination namespace"></label><button id="save">Save active edits</button><button id="preflight">Check saved migration</button><button id="migrate">Migrate legacy room</button><button id="retry" disabled>Retry last migration</button><button id="old" disabled>Try old writer</button><button id="retain" disabled>Retain offline edits</button><label>Rollback source <select id="restore"><option value="source-branch">Pending source branch</option><option value="frozen-source">Frozen original</option></select></label><button id="rollback" disabled>Rollback with archive</button><button id="retry-rollback" disabled>Retry last rollback</button><label><input id="drop" type="checkbox">Drop migration acknowledgement (test only)</label></header>
<div id="message" role="status">Opening…</div><p id="draft-status" aria-live="polite"></p><button id="download-local" type="button" hidden>Download local draft</button><pre id="report"></pre><div class="panes"><section id="offline"><h2>Offline writer · legacy protocol</h2></section><section id="active"><h2 id="active-title">Active editor · legacy protocol</h2></section><section id="archive"><h2 id="archive-title">Recovery archive · read only</h2></section></div>
<script type="module">
import * as Y from 'yjs';

import {createYjsCollaborationExtension} from '/artifacts/yjs-namespace-build-20261107/legacy-adapter.js';

import {captureRetainedCheckpoint,restoreRetainedCheckpoint} from '/artifacts/yjs-namespace-build-20261107/checkpoint.js';
import {captureLegacyCheckpoint,restoreLegacyCheckpoint} from '/artifacts/yjs-namespace-build-20261107/legacy-checkpoint.js';
import {openYjsRoom} from '/artifacts/yjs-namespace-build-20261107/bound-room.js';
import {openBrowserDrafts,scheduleBrowserDraftAutosave} from '/examples/backends/retained-browser-drafts.ts';
import {downloadDocumentFile} from '/examples/react-app/src/math-document-files.ts';
const sourceRoom='Research / α 😀',version='browser-schema-1',content={type:'doc',attrs:{metadata:{title:'Migration paper'}},content:[{type:'paragraph',attrs:{nodeId:'intro'},content:[{type:'text',text:'Alpha technical note.'}]},{type:'blockquote',content:[{type:'paragraph',content:[{type:'text',text:'Keep every accepted edit recoverable.'}]}]},{type:'image_super',attrs:{nodeId:'figure',src:'/tests/fixtures/cross-container-figure.png',alt:'Original figure'}},{type:'math_block',attrs:{latex:'x^2+y^2',label:'eq:one'}},{type:'code_block',attrs:{language:'lean'},content:[{type:'text',text:'example : 1 + 1 = 2 := by decide'}]}]};
const nested=new URLSearchParams(location.search).has('nested');
const schema=new Schema(composeExtensions([CoreExtension,MathExtension]).schema);
const sessionKey='fountain-handoff:'+location.pathname+location.search;
let token,current,original,active,archived,migration,rollback,rollbackArchiveId,archiveId,visibleArchiveId,lastReplay,initialEpoch,pendingArchive;
let offlineBatch;
let drafts,autosave;
const message=document.querySelector('#message');
const encode=value=>JSON.stringify(value,(_key,value)=>value instanceof Uint8Array?{__wire:btoa(String.fromCharCode(...value))}:value),decode=text=>JSON.parse(text,(_key,value)=>value&&typeof value==='object'&&Object.keys(value).length===1&&typeof value.__wire==='string'?Uint8Array.from(atob(value.__wire),c=>c.charCodeAt(0)):value);

const shortcuts=new Plugin({props:{handleKeyDown:(editor,event)=>!event.altKey&&!event.isComposing&&(event.ctrlKey||event.metaKey)&&['z','y'].includes(event.key.toLowerCase())?(event.key.toLowerCase()==='y'||event.shiftKey?redoCollaboration(editor):undoCollaboration(editor)):false}});
function mount(doc,id,previous,model,protocol='legacy',epoch,namespace=sourceRoom,fragment,bound){
 const settings={captureTimeout:0,user:{id,name:id,color:'#7048e8'}};
 const extension=id==='archive'?null:bound?bound.createExtension(settings):(protocol==='legacy'?createYjsCollaborationExtension:createRetainedYjsCollaborationExtension)({document:doc,fragmentName:namespace,...(protocol==='legacy'?{preserveConcurrentRoots:true}:{}),...(fragment?{fragment}:{}),...settings});
 if(previous){previous.view.destroy();previous.editor.destroy();previous.doc.destroy();previous.host.remove()}
 const host=document.createElement('div');document.querySelector('#'+id).append(host);
 const kit=composeExtensions([CoreExtension,MathExtension,...(extension?[extension]:[])]),editor=createEditor({schema:kit.schema,plugins:[...kit.plugins,shortcuts],content:model??content,editable:id!=='archive'}),view=new EditorView(host,editor,{ariaLabel:id==='offline'?'Offline editor':id==='active'?'Active editor':'Archive reader'});
 if(id==='active')document.querySelector('#active-title').textContent='Active editor · '+protocol+' protocol';
 return {doc,host,editor,view,protocol,epoch,namespace,fragment};
}
function codec(checkpoint){if(checkpoint.manifest.format==='fountain-legacy-checkpoint/1')return {protocol:'legacy',restore:restoreLegacyCheckpoint};if(checkpoint.manifest.format==='fountain-retained-checkpoint/1')return {protocol:'retained',restore:restoreRetainedCheckpoint};throw new Error('Unknown checkpoint protocol')}
async function reopen(checkpoint,id,previous,epoch){
 const selected=codec(checkpoint),restored=await selected.restore(checkpoint,schema,version);
 return mount(restored.document,id,previous,restored.baseDocument.toJSON(),selected.protocol,epoch,checkpoint.manifest.room,restored.reader?.fragment);
}
function openRoom(expected,protocols){
 return openYjsRoom({schema,schemaVersion:version,expected,protocols,
  open:supported=>request('join',{protocols:supported}),admit:offer=>request('admit',offer)});
}
async function openActive(snapshot,previous,beforeMount){
 const bound=await openRoom(snapshot,['legacy','retained']);
 const {document,baseDocument,fragment,lease}=bound;
 try{beforeMount?.()}catch(error){document.destroy();throw error}
 return mount(document,'active',previous,baseDocument.toJSON(),lease.protocol,lease.epoch,lease.room,fragment,bound);
}
function report(text){document.querySelector('#report').textContent=text+'\nLast acknowledged protocol: '+current.protocol+' · revision '+current.revision+' · '+current.phase+'\nWriter epoch: '+active.epoch+'\nActive namespace: '+active.namespace+'\nMigration archive: '+(archiveId??'none')}
function captureWriter(writer){
 return writer.protocol==='legacy'
  ? captureLegacyCheckpoint(writer.doc,schema,version,{},writer.namespace,writer.fragment)
  : captureRetainedCheckpoint(writer.doc,schema,version,writer.namespace);
}
function watchWriter(writer){writer.doc.on('update',()=>{
 if(writer===original&&offlineBatch)offlineBatch.changed=true;
 autosave.changed();
});}
async function persistOperation(){autosave.changed();await autosave.flush();}
function setControlsBusy(busy){
 for(const button of document.querySelectorAll('header button'))button.disabled=busy;
 if(busy)return;
 for(const id of ['retry','old','retain','rollback'])document.querySelector('#'+id).disabled=!migration;
 document.querySelector('#retry-rollback').disabled=!rollback;
}
function action(id,run){
 document.querySelector('#'+id).onclick=async()=>{
  setControlsBusy(true);
  try{await run();}
  catch(error){message.textContent='Request failed: '+error.message+' · editor retained; retry explicitly';}
  finally{setControlsBusy(false);}
 };
}
async function install(result){
 pendingArchive=undefined;
 if(active.epoch===result.snapshot.epoch){if(active.protocol!==result.snapshot.protocol)throw new Error('Same epoch changed protocol');Y.applyUpdate(active.doc,result.snapshot.checkpoint.update,'reconnect');}
 else{
  // Persist this still-mounted writer's batch before replacing its view. This
  // also covers typing while a committed migration acknowledgement was lost.
  const source=active;
  if(source.epoch!==result.archive.source.epoch)throw new Error('Unreconciled editor epoch; preserve this editor for explicit recovery');
  const model=source.editor.state.doc,update=Y.encodeStateAsUpdate(source.doc);
  const saved=await request('retain',{archiveId:result.archive.id,sourceEpoch:source.epoch,update});
  active=await openActive(result.snapshot,source,()=>{
   if(active===source&&source.editor.state.doc===model){
    // State vectors alone miss a deletion that creates no Yjs item.
    const latest=Y.encodeStateAsUpdate(source.doc);
    if(latest.length===update.length&&latest.every((byte,index)=>byte===update[index]))return;
   }
   throw new Error('Source editor changed during reconnection');
  });
  watchWriter(active);
  pendingArchive=saved;
 }
 current=result.snapshot;lastReplay={replayed:result.replayed,current:result.current};report((result.replayed?'Replayed durable receipt':'Atomic protocol switch committed')+' · current='+result.current)
}
async function showRecovery(result){
 archived=await reopen(pendingArchive?.branch??result.archive.branch,'archive',archived);
 visibleArchiveId=result.archive.id;
 document.querySelector('#archive-title').textContent='Retired source · edits preserved';
}
async function submitOperation(kind,operation,dropAcknowledgement=false){
 await persistOperation();
 if(!operation.ticket){
  try{operation.ticket=await request('freeze',operation.expected);}
  catch(error){
   if(error.code!=='revision-conflict')throw error;
   operation.ticket=await request('recover-frozen',operation.expected);
  }
  await persistOperation();
 }
 return request(kind,{...operation,dropAcknowledgement});
}
action('save',async()=>{current=await request('write',{epoch:active.epoch,protocol:active.protocol,update:Y.encodeStateAsUpdate(active.doc)});message.textContent='Active edits durably saved';report('Accepted active edit')});
action('retained-only',async()=>{const bound=await openRoom({key:current.key});bound.document.destroy();message.textContent='Retained-only client can join this room'});
async function finishMigration(retry){
 const result=await submitOperation('migrate',migration,!retry&&document.querySelector('#drop').checked);
 await install(result);
 if(result.current)await showRecovery(result);
 await persistOperation();
 message.textContent=!result.current?'Historical receipt replayed · current room unchanged'
  :retry&&result.replayed?'Durable migration receipt replayed · source edits preserved':'Legacy room migrated to retained · source edits preserved';
}
function selectedDestination(){
 const destinationRoom=document.querySelector('#destination').value;
 if(!/^[A-Za-z0-9][A-Za-z0-9_.:-]{0,193}$/.test(destinationRoom))throw new Error('Invalid explicit destination namespace');
 if(active.protocol!=='legacy')throw new Error('Only legacy sources can be migrated');
 return destinationRoom;
}
action('preflight',async()=>{
 const destinationRoom=selectedDestination();
 let checked;
 try{checked=await request('preflight',{expected:{epoch:current.epoch,revision:current.revision},destinationRoom});}
 catch(error){report('Migration check refused for '+destinationRoom);throw error;}
 const plan=checked.report,roots=plan.auxiliaryRoots.map(root=>root.name).join(', ')||'none';
 message.textContent='Migration check passed · legacy room stays open for editing';
 report('Checked saved revision '+checked.revision+': '+plan.sourceRoom+' → '+plan.destinationRoom+'\n'+
  'Document content matches · auxiliary roots: '+roots+'\nLegacy '+plan.sourceBytes+' bytes · retained rehearsal '+plan.destinationBytes+' bytes');
});
action('migrate',async()=>{
 const destinationRoom=selectedDestination();
 current=await request('write',{epoch:active.epoch,protocol:active.protocol,update:Y.encodeStateAsUpdate(active.doc)});
 const expected={epoch:current.epoch,revision:current.revision};
 await request('preflight',{expected,destinationRoom});
 migration={expected,operation:crypto.randomUUID(),destinationRoom};
 archiveId=migration.operation;
 await finishMigration(false);
});
action('retry',()=>finishMigration(true));
action('old',async()=>{try{await request('write',{epoch:initialEpoch,protocol:'legacy',update:Y.encodeStateAsUpdate(original.doc)});throw new Error('Unexpected stale acceptance')}catch(error){if(error.code!=='stale-epoch')throw error;message.textContent='Old writer rejected · pending edits remain in the offline editor'}});
action('retain',async()=>{
 if(!offlineBatch||offlineBatch.archiveId!==archiveId||offlineBatch.acknowledged&&offlineBatch.changed){
  offlineBatch={archiveId,sourceEpoch:initialEpoch,update:Y.encodeStateAsUpdate(original.doc),acknowledged:false,changed:false};
 }
 // Keep the exact outgoing bytes through reload and later offline edits.
 await persistOperation();
 const {archiveId:target,sourceEpoch,update}=offlineBatch;
 const result=await request('retain',{archiveId:target,sourceEpoch,update});
 offlineBatch.acknowledged=true;
 archived=await reopen(result.branch,'archive',archived);
 visibleArchiveId=result.id;
 await persistOperation();
 document.querySelector('#archive-title').textContent='Retired legacy branch · offline edits retained';
 message.textContent=offlineBatch.changed
  ?'Offline edits retained separately · newer offline edits still need saving'
  :'Offline edits retained separately · active room unchanged';
 report('Retired branch revision: '+result.branchRevision);
});
async function finishRollback(){
 const result=await submitOperation('rollback',rollback);
 await install(result);
 if(result.current){
  rollbackArchiveId=result.archive.id;
  await showRecovery(result);
  document.querySelector('#archive-title').textContent='Replaced retained room · edits archived';
  message.textContent='Rollback committed to legacy · retained edits preserved';
 }else message.textContent='Historical rollback receipt · current room unchanged';
 await persistOperation();
}
action('rollback',async()=>{
 current=await request('write',{epoch:active.epoch,protocol:active.protocol,update:Y.encodeStateAsUpdate(active.doc)});
 rollback={expected:{epoch:current.epoch,revision:current.revision},operation:crypto.randomUUID(),archive:archiveId,restore:document.querySelector('#restore').value};
 await finishRollback();
});
action('retry-rollback',finishRollback);
async function seedRoom(){
 const doc=new Y.Doc();
 let fragment;
 if(nested){
  fragment=new Y.XmlFragment();
  const folder=doc.getMap('research-folder');
  folder.set('title','Physics review');folder.set('body',fragment);
 }

}
async function reopenSession(saved){
 ({initialEpoch,migration,rollback,archiveId,rollbackArchiveId,visibleArchiveId,offlineBatch}=saved);
 original=await reopen(saved.offline,'offline',undefined,initialEpoch);
 active=await reopen(saved.writer.checkpoint,'active',undefined,saved.writer.epoch);
 current=saved.acknowledged;
 let online;
 try{online=await request('snapshot');}catch{/* The local draft is still available. */}
 if(!online)return 'Local recovery copy reopened · room unavailable';
 if(online.key!==current.key)throw new Error('Local recovery copy belongs to a different room');

 if(visibleArchiveId){
  const savedArchive=await request('archive',{id:visibleArchiveId});
  if(savedArchive)archived=await reopen(savedArchive.branch,'archive');
 }

  ?'Local recovery copy reopened · retry the pending handoff'
  :'Local recovery copy reopened';
}
try{
 setControlsBusy(true);
 if(nested)document.querySelector('h1').textContent='Move a nested research document';
 const resumed=sessionStorage.getItem(sessionKey);
 token=resumed??(await request('open',{nested})).token;
 drafts=await openBrowserDrafts('fountain-cross-format-recovery-v1',token);
 const write=drafts.createAutosaveSlot(token);
 autosave=scheduleBrowserDraftAutosave(async()=>{
  const writer=active;
  const [checkpoint,offline]=await Promise.all([captureWriter(writer),captureWriter(original)]);
  if(writer!==active)throw new Error('Editor changed during draft capture');
  const {key,epoch,revision,phase,protocol}=current;
  await write({writer:{epoch:writer.epoch,checkpoint},offline,initialEpoch,migration,rollback,archiveId,rollbackArchiveId,visibleArchiveId,offlineBatch,
   acknowledged:{key,epoch,revision,phase,protocol}});
 },(status,error)=>{
  document.querySelector('#draft-status').textContent=status==='saved'?'Recovery copy saved on this device'
   :status==='pending'?'Saving recovery copy…':'Recovery copy failed: '+error.message;
 });
 let opened='Ready · edit offline or active, then migrate';
 if(resumed){
  const saved=(await drafts.list()).find(draft=>draft.id===token);
  if(!saved)throw new Error('Local recovery copy is missing');
  opened=await reopenSession(saved);
 }else await seedRoom();
 watchWriter(original);watchWriter(active);
 await persistOperation();
 sessionStorage.setItem(sessionKey,token);
 setControlsBusy(false);
 report(resumed?'Writer reopened from local recovery':'Legacy room initialized');
 message.textContent=opened;
}catch(error){message.textContent='Opening failed: '+error.message;throw error}
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='hidden')void autosave.flush().catch(()=>undefined);
});
function dropAdmittedRoot(){
 autosave.stop();
 if(active.fragment?.parent)active.doc.getMap('research-folder').delete('body');
 else active.doc.getXmlFragment(active.namespace).delete(0,1);
 const collaboration=getCollaborationState(active.editor);
 message.textContent=collaboration?.error?.message??'No collaboration error';
 document.querySelector('#draft-status').textContent='New edits are only in this editor. Download a copy before leaving.';
 document.querySelector('#save').disabled=true;
 document.querySelector('#download-local').hidden=false;
 return collaboration?.status;
}
document.querySelector('#download-local').addEventListener('click',()=>{
 downloadDocumentFile(document,'recovered-draft.fountain.json',JSON.stringify(active.editor.getJSON(),null,2),'application/json');
});
window.audit={snapshot:async()=>{const server=await request('snapshot'),restored=await codec(server.checkpoint).restore(server.checkpoint,schema,version);try{const folder=restored.document.share.get('research-folder');return {folderTitle:folder?.get('title'),folderRoom:folder?.get('documentRoom'),nestedFragment:server.checkpoint.manifest.fragment,activeNested:Boolean(active.fragment?.parent),offline:original.editor.getJSON(),active:active.editor.getJSON(),archive:archived?.editor.getJSON(),server:restored.baseDocument.toJSON(),epoch:server.epoch,revision:server.revision,namespace:server.checkpoint.manifest.room,activeNamespace:active.namespace,archiveNamespace:archived?.namespace,phase:server.phase,protocol:server.protocol,activeProtocol:active.protocol,archiveProtocol:archived?.protocol,archiveId,rollbackArchiveId,lastReplay}}finally{restored.document.destroy()}},batch:(id,revision)=>request('batch',{id,revision}),close:()=>{autosave.stop();drafts.close();return request('close')}};
