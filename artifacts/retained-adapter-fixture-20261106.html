<!doctype html><html lang="en"><meta charset="utf-8"><title>Retained collaboration audit</title>
<link rel="stylesheet" href="/src/styles.css">
<style>
body{margin:24px;background:#f5f3ff;color:#19152f;font:16px system-ui}h1{margin:0 0 8px;font-size:28px}button,label{font:inherit}button{padding:8px 12px;border:1px solid #c5bce6;border-radius:6px;background:white;cursor:pointer}header{margin-bottom:16px}#panes{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{min-width:0;background:white;border:1px solid #c5bce6;border-radius:12px;overflow:hidden}h2{padding:16px;margin:0;font-size:19px}.tools{display:flex;flex-wrap:wrap;gap:6px;padding:12px;background:#efecfa}.fountain-editor{min-height:300px;padding:24px}.fountain-editor img{max-width:100%;max-height:130px;object-fit:contain}output{display:block;padding:12px;font:13px monospace}#message{min-height:24px;margin:10px 0}input[type=file]{max-width:250px}
</style>
<h1>Retained collaboration — internal browser audit</h1><p>Two Fountain editors for testing the experimental retained adapter and the legacy protocol.</p>
<header><button id="reset">Reset Launch</button> <button id="pause">Pause sync</button> <button id="sync">Synchronize</button> <button id="room">Switch to Planning</button> <label>Reopen JSON <input id="open" type="file" accept="application/json,.json"></label> <label><input id="host-annotation" type="checkbox"> Annotate edits from host</label><div id="message" role="status"></div></header>
<details><summary>Protocol conflict test</summary><button id="mixed">Open separate legacy and retained rooms</button> <button id="repair" disabled>Remove incompatible roots</button></details>
<div id="panes"></div>
<script type="module">
import * as Y from 'yjs';
import {CoreExtension,Plugin,EditorView,composeExtensions,createEditor,createCollaborationExtension,getCollaborationState,replaceCollaborationAdapter,toggleQuote,toggleList,setMark,undoCollaboration,redoCollaboration} from '/src/index.ts';
import {RetainedYjsCollaborationAdapter} from '/src/yjs/retained-adapter.ts';
import {YjsCollaborationAdapter} from '/src/yjs/index.ts';
const panes=document.querySelector('#panes'),message=document.querySelector('#message');
let peers=[],linked=true,unbind=[],states=new Map(),listeners=new Set();
const original=text=>({type:'doc',attrs:{audit:'root'},content:[{type:'paragraph',content:[{type:'text',text}]},{type:'image_super',attrs:{src:'/tests/fixtures/cross-container-figure.png',alt:'Retained figure'}}]});
// This plain-core host deliberately omits snapshot HistoryExtension. Route its
// keyboard shortcuts to the same origin-aware commands used by the buttons.
const shortcuts=new Plugin({props:{handleKeyDown:(editor,event)=>{
 const key=event.key.toLowerCase();if(!editor.editable||event.isComposing||event.altKey||!(event.ctrlKey||event.metaKey)||(key!=='z'&&key!=='y'))return false;
 if(key==='y'||event.shiftKey)redoCollaboration(editor);else undoCollaboration(editor);
 return true;
}}});
function awareness(doc){return {clientID:doc.clientID,getStates:()=>states,getLocalState:()=>states.get(doc.clientID)??null,setLocalStateField:(key,value)=>{states.set(doc.clientID,{...states.get(doc.clientID),[key]:value});for(const listener of [...listeners])listener()},on:(_,fn)=>listeners.add(fn),off:(_,fn)=>listeners.delete(fn)}}
function adapter(doc,id,legacy=false){const Adapter=legacy?YjsCollaborationAdapter:RetainedYjsCollaborationAdapter;return new Adapter({document:doc,awareness:awareness(doc),captureTimeout:0,presenceThrottleMs:0,user:{id,name:id,color:id==='Ada'?'#7048e8':'#d63384'}})}
function status(){for(const p of peers){const state=getCollaborationState(p.editor);p.output.textContent=`${state?.status} · ${p.editor.state.doc.textContent} · ${state?.presences.length??0} peers${p.editor.state.doc.attrs.hostAnnotation?' · host annotation retained':''}`;if(state?.error)message.textContent=state.error.message}}
function bind(){for(const stop of unbind)stop();unbind=[];for(const [from,to] of [[peers[0].doc,peers[1].doc],[peers[1].doc,peers[0].doc]]){const receive=(update,origin)=>{if(linked&&origin!=='peer')Y.applyUpdate(to,update,'peer')};from.on('update',receive);unbind.push(()=>from.off('update',receive))}
 const field='attr:'+Array.from('hostAnnotation',letter=>letter.charCodeAt(0).toString(16).padStart(4,'0')).join('');
 for(const {doc} of peers){const annotate=transaction=>{if(!document.querySelector('#host-annotation').checked||transaction.origin==='host-annotation')return;const root=doc.getMap('fountain-nodes:root');if(root.get(field)!=='true')doc.transact(()=>root.set(field,'true'),'host-annotation')};doc.on('afterTransaction',annotate);unbind.push(()=>doc.off('afterTransaction',annotate))}
}
function sync(){const a=Y.encodeStateAsUpdate(peers[0].doc),b=Y.encodeStateAsUpdate(peers[1].doc);Y.applyUpdate(peers[0].doc,b,'peer');Y.applyUpdate(peers[1].doc,a,'peer');linked=true;message.textContent='Synchronized';status()}
function reset(content=original('Alpha'),mixed=false){for(const stop of unbind)stop();unbind=[];for(const p of peers){p.view.destroy();p.editor.destroy();p.doc.destroy()}peers=[];states=new Map();listeners=new Set();panes.replaceChildren();linked=!mixed;
 document.querySelector('#repair').disabled=!mixed;
 for(const id of ['Ada','Grace']){const doc=new Y.Doc(),legacy=mixed&&id==='Grace';if(peers.length&&!mixed)Y.applyUpdate(doc,Y.encodeStateAsUpdate(peers[0].doc),'seed');const a=adapter(doc,id,legacy),kit=composeExtensions([CoreExtension,createCollaborationExtension({adapter:()=>a})]);const editor=createEditor({schema:kit.schema,plugins:[...kit.plugins,shortcuts],content});const section=document.createElement('section');section.id=id.toLowerCase();const heading=document.createElement('h2');heading.textContent=mixed?`${id} · ${legacy?'legacy':'retained'}`:id;const tools=document.createElement('div');tools.className='tools';const mount=document.createElement('div'),output=document.createElement('output');section.append(heading,tools,mount,output);panes.append(section);const view=new EditorView(mount,editor,{ariaLabel:`${id} editor`});const p={doc,editor,view,output,legacy};peers.push(p);
 for(const [title,run] of [['Quote',()=>toggleQuote(editor)],['Bullet',()=>toggleList(editor,'bullet')],['Ordered',()=>toggleList(editor,'ordered')],['Task',()=>toggleList(editor,'task')],['Bold',()=>setMark(editor,'strong')],['Undo',()=>undoCollaboration(editor)],['Redo',()=>redoCollaboration(editor)],['Download JSON',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(editor.getJSON(),null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='retained-document.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}]]){const button=document.createElement('button');button.textContent=title;button.onmousedown=e=>e.preventDefault();button.onclick=()=>{run();view.focus();status()};tools.append(button)}editor.subscribe(status)
 }bind();message.textContent=mixed?'Separate rooms · sync paused':'Launch room';status()}
document.querySelector('#reset').onclick=()=>reset();document.querySelector('#pause').onclick=()=>{linked=false;message.textContent='Sync paused — edit independently'};document.querySelector('#sync').onclick=sync;
document.querySelector('#mixed').onclick=()=>reset(original('Alpha'),true);
document.querySelector('#repair').onclick=()=>{
 linked=false;
 for(const peer of peers){
  const fragment=peer.doc.getXmlFragment('fountain'),own=peer.legacy?'fountain-node':'fountain-retained-room';
  const foreign=fragment.toArray().findIndex(root=>root.nodeName!==own);
  if(foreign>=0) fragment.delete(foreign,1);
 }
 status();
};
document.querySelector('#room').onclick=()=>{for(const stop of unbind)stop();unbind=[];const seed=new Y.Doc(),a=adapter(seed,'seed'),kit=composeExtensions([CoreExtension,createCollaborationExtension({adapter:()=>a})]),temporary=createEditor({schema:kit.schema,plugins:kit.plugins,content:original('Planning draft')});const bytes=Y.encodeStateAsUpdate(seed);temporary.destroy();seed.destroy();for(const p of peers){const old=p.doc;p.doc=new Y.Doc();Y.applyUpdate(p.doc,bytes,'seed');replaceCollaborationAdapter(p.editor,adapter(p.doc,p.view.dom.getAttribute('aria-label').split(' ')[0]));old.destroy()}linked=true;bind();message.textContent='Planning room';status()};
document.querySelector('#open').onchange=async e=>{try{reset(JSON.parse(await e.target.files[0].text()));message.textContent='Reopened portable document'}catch(error){message.textContent=String(error)}};
window.audit={snapshot:()=>peers.map(p=>({json:p.editor.getJSON(),selection:p.editor.state.selection,status:getCollaborationState(p.editor)?.status})),sameViews:()=>peers.map(p=>p.view.dom)};
reset();
</script></html>
