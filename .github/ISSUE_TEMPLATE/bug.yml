name: Bug report
description: Report reproducible behavior in FountainJS
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link a reproduction or paste minimal code and document JSON.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FountainJS version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser or Node environment
    validations:
      required: true
