name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: lts
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check python-docx==1.2.0
      - run: pnpm build
      - run: pnpm test:api
      - run: pnpm test:server-runtimes
      - run: bun scripts/smoke-server-html-runtime.mjs
      - run: deno run --allow-read scripts/smoke-server-html-runtime.mjs
      - run: pnpm test:package
      - run: pnpm test:headless
      - run: pnpm test:markdown-conformance
      - run: pnpm test:math-reference
      - run: pnpm test:docx-interoperability
      - run: pnpm test:budget
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm dlx publint@0.3.24
      - run: pnpm dlx @arethetypeswrong/cli@0.18.5 --pack . --entrypoints . ./core ./ai/document-tools ./ai/conversation ./ai/generated-media ./docx ./document-utilities ./emoji-data ./react ./vue ./svelte ./yjs ./comments ./react/comments ./tracked-changes ./react/tracked-changes ./versions ./react/versions ./details ./ruby ./text-style ./testing ./migrations ./node-ids ./structured-attributes ./html/server ./widgets ./widgets/dom ./react/widgets ./pages ./pages/dom ./pages/preview
      # Angular's documented partial-Ivy distribution is ESM-only. Keep the
      # existing dual-format entries under strict checks; scope this profile.
      - run: pnpm dlx @arethetypeswrong/cli@0.18.5 --pack . --entrypoints ./angular --profile esm-only
      - run: pnpm exec vite build --base /fountainjs/
      - run: pnpm pack --dry-run
  # A performance failure must still fail CI, but must not prevent collecting
  # the full functional/type/package evidence. Same runtime, command and caps.
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:performance
  lean-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install pinned Lean toolchain
        env:
          ELAN_ARCHIVE_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
          ELAN_VERSION: v4.2.4
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output elan.tar.gz \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_ARCHIVE_SHA256}  elan.tar.gz" | sha256sum --check
          tar --extract --gzip --file elan.tar.gz
          ./elan-init -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          rm elan-init elan.tar.gz
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:lean-integration
  browser:
    runs-on: ubuntu-latest
    env:
      # All four clipboard workflows still run with their unchanged assertions.
      # Independent controls prove headless Linux WebKit loses rich clipboard
      # data while the real Xvfb-backed display retains it. Serialize native
      # clipboard owners; keep the rest of the matrix headless.
      FOUNTAIN_DISPLAY_CLIPBOARD_PATTERN: "pastes native rich research notes|copies shared automatic list scope|disabled line numbers through native copy"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      # Independent clipboard diagnosis does not turn failures into passes or
      # skip Fountain restoration assertions. Include source replacement, since
      # an unchanged selected document cannot prove an internal paste occurred.
      - name: Record independent native clipboard delivery
        run: node scripts/check-browser-clipboard-capability.mjs > native-clipboard-capability.jsonl
      - name: Diagnose headed Linux WebKit clipboard independently
        continue-on-error: true
        run: xvfb-run --auto-servernum env FOUNTAIN_CLIPBOARD_HEADED=1 FOUNTAIN_CLIPBOARD_ENGINE=webkit node scripts/check-browser-clipboard-capability.mjs > native-clipboard-headed-capability.jsonl
      # Keep native Linux WebKit colour-input failures visible before the full
      # matrix. Windows WebKit uses a text fallback and cannot certify this.
      - name: Structural direction and native-source preflight
        run: pnpm exec playwright test --project=chromium --project=firefox --project=webkit --output=structural-direction-preflight-results --grep "retains structural RTL against native source|imports inherited inline alignment|retains a shared automatic section direction|inserts table columns on the physical left|preserves list direction through real transforms|reorders real runbook blocks|retains shared automatic list scope|retains technical code reading direction" --grep-invert "${FOUNTAIN_DISPLAY_CLIPBOARD_PATTERN}"
      - name: Native clipboard workflows on the Linux display
        run: xvfb-run --auto-servernum pnpm exec playwright test --headed --project=chromium --project=firefox --project=webkit --workers=1 --output=structural-direction-clipboard-results --grep "${FOUNTAIN_DISPLAY_CLIPBOARD_PATTERN}"
      - name: Native control and document focus preflight
        run: pnpm exec playwright test --project=webkit --grep "opens and cancels public configuration panels|keeps the public native colour field|preserves inert HTML comments|edits RTL blocks|compares list-first code text-click"
      - name: Firefox native RTL selection preflight
        run: pnpm exec playwright test --project=firefox --grep "edits RTL blocks|compares list-first code text-click"
      - name: Remaining headless browser matrix
        run: pnpm exec playwright test --grep-invert "${FOUNTAIN_DISPLAY_CLIPBOARD_PATTERN}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direction-and-document-focus-evidence
          path: |
            native-clipboard-capability.jsonl
            native-clipboard-headed-capability.jsonl
            structural-direction-clipboard-results/**/native-rich-paste-*.png
            structural-direction-clipboard-results/**/native-rich-paste-*.json
            structural-direction-clipboard-results/**/code-direction-*.png
            structural-direction-clipboard-results/**/code-direction-observations.json
            structural-direction-clipboard-results/**/code-direction-native-clipboard-delivery.json
            structural-direction-clipboard-results/**/auto-scope-*.png
            structural-direction-clipboard-results/**/auto-scope-observations.json
            structural-direction-clipboard-results/**/auto-scope-native-clipboard-delivery*.json
            test-results/**/native-rich-paste-*.png
            test-results/**/native-rich-paste-*.json
            test-results/**/anchor-loss-*.png
            test-results/**/anchor-loss-observations.json
            test-results/**/anchor-loss-export.json
            test-results/**/anchor-loss-export.html
            structural-direction-preflight-results/**/native-rich-paste-*.png
            structural-direction-preflight-results/**/native-rich-paste-*.json
            test-results/**/code-direction-*.png
            test-results/**/code-direction-observations.json
            test-results/**/code-direction-native-clipboard-delivery.json
            test-results/**/auto-scope-native-clipboard-delivery*.json
            structural-direction-preflight-results/**/code-direction-*.png
            structural-direction-preflight-results/**/code-direction-observations.json
            structural-direction-preflight-results/**/code-direction-native-clipboard-delivery.json
            structural-direction-preflight-results/**/auto-scope-native-clipboard-delivery*.json
            test-results/**/rtl-*.png
            test-results/**/comment-editor-*.png
            test-results/**/comment-reader-*.png
            test-results/**/native-colour-mapped-selection.png
            test-results/**/native-rtl-selection-baseline.json
            test-results/**/inherited-auto-explicit-left-reader.png
            test-results/**/word-reopened-explicit-left-reader.png
            test-results/**/explicit-left.docx
            test-results/**/auto-container-*.png
            test-results/**/code-click-*.png
            test-results/**/code-click-native-focus.json
            test-results/**/code-click-native-baseline.json
            test-results/**/inherited-alignment-*.png
            test-results/**/native-inline-alignment.json
            test-results/**/rtl-structural-observations.json
            test-results/**/table-side-*.png
            test-results/**/table-side-observations.json
            test-results/**/list-direction-*.png
            test-results/**/list-direction-observations.json
            test-results/**/block-direction-*.png
            test-results/**/block-direction-*-observations.json
            test-results/**/auto-scope-*.png
            test-results/**/auto-scope-observations.json
            structural-direction-preflight-results/**/rtl-*.png
            structural-direction-preflight-results/**/rtl-structural-observations.json
            structural-direction-preflight-results/**/inherited-alignment-*.png
            structural-direction-preflight-results/**/native-inline-alignment.json
            structural-direction-preflight-results/**/auto-container-*.png
            structural-direction-preflight-results/**/table-side-*.png
            structural-direction-preflight-results/**/table-side-observations.json
            structural-direction-preflight-results/**/list-direction-*.png
            structural-direction-preflight-results/**/list-direction-observations.json
            structural-direction-preflight-results/**/block-direction-*.png
            structural-direction-preflight-results/**/block-direction-*-observations.json
            structural-direction-preflight-results/**/auto-scope-*.png
            structural-direction-preflight-results/**/auto-scope-observations.json
          if-no-files-found: ignore
          retention-days: 7
      # A passing diagnostic journey can still document known viewer failures.
      # Preserve this evidence on success too; it is not Word fidelity approval.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docx-math-viewer-diagnostics
          path: |
            test-results/**/viewer-observations.json
            test-results/**/equations-side-by-side.png
            test-results/**/edited-equations.png
            test-results/**/edited-compound-equations.png
            test-results/**/fallback-equations.png
            test-results/**/restored-equations.png
            test-results/**/experimental-equations.docx
            test-results/**/edited-equations.docx
            test-results/**/edited-compound-equations.docx
            test-results/**/fallback-equations.docx
            test-results/**/restored-equations.docx
            test-results/**/reopened-equations.png
            test-results/**/changed-equation-refused.png
            test-results/**/externally-changed-equations.docx
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
