name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: lts
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check python-docx==1.2.0
      - run: pnpm build
      - run: bun scripts/smoke-server-html-runtime.mjs
      - run: deno run --allow-read scripts/smoke-server-html-runtime.mjs
      - run: pnpm test:package
      - run: pnpm test:headless
      - run: pnpm test:markdown-conformance
      - run: pnpm test:docx-interoperability
      - run: pnpm test:budget
      - run: pnpm test:performance
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm dlx publint@0.3.24
      - run: pnpm dlx @arethetypeswrong/cli@0.18.5 --pack . --entrypoints . ./core ./ai/document-tools ./ai/conversation ./ai/generated-media ./docx ./document-utilities ./emoji-data ./react ./vue ./svelte ./yjs ./comments ./react/comments ./tracked-changes ./react/tracked-changes ./versions ./react/versions ./details ./ruby ./text-style ./testing ./migrations ./node-ids ./structured-attributes ./html/server ./widgets ./widgets/dom ./react/widgets ./pages ./pages/dom ./pages/preview
      # Angular's documented partial-Ivy distribution is ESM-only. Keep the
      # existing dual-format entries under strict checks; scope this profile.
      - run: pnpm dlx @arethetypeswrong/cli@0.18.5 --pack . --entrypoints ./angular --profile esm-only
      - run: pnpm exec vite build --base /fountainjs/
      - run: pnpm pack --dry-run
  lean-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install pinned Lean toolchain
        env:
          ELAN_ARCHIVE_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
          ELAN_VERSION: v4.2.4
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output elan.tar.gz \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ELAN_ARCHIVE_SHA256}  elan.tar.gz" | sha256sum --check
          tar --extract --gzip --file elan.tar.gz
          ./elan-init -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          rm elan-init elan.tar.gz
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:lean-integration
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test:browser
      # A passing diagnostic journey can still document known viewer failures.
      # Preserve this evidence on success too; it is not Word fidelity approval.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docx-math-viewer-diagnostics
          path: |
            test-results/**/viewer-observations.json
            test-results/**/equations-side-by-side.png
            test-results/**/edited-equations.png
            test-results/**/edited-compound-equations.png
            test-results/**/fallback-equations.png
            test-results/**/restored-equations.png
            test-results/**/experimental-equations.docx
            test-results/**/edited-equations.docx
            test-results/**/edited-compound-equations.docx
            test-results/**/fallback-equations.docx
            test-results/**/restored-equations.docx
            test-results/**/reopened-equations.png
            test-results/**/changed-equation-refused.png
            test-results/**/externally-changed-equations.docx
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
