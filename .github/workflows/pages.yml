name: Playground

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'playwright.pages.config.ts'
      - 'tests/browser/starter-downloads.spec.ts'
      - 'examples/starters/**'
      - 'examples/react-app/src/StarterDownload.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec vite build --base /fountainjs/
      - uses: actions/upload-pages-artifact@v4
        id: archive
        with:
          path: examples/react-app/dist
      - name: Download the uploaded Pages archive by ID
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.archive.outputs.artifact_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/pages-upload.zip"
          unzip -q "$RUNNER_TEMP/pages-upload.zip" -d "$RUNNER_TEMP/pages-upload"
      - name: Extract the uploaded Pages archive
        run: |
          mkdir -p "$RUNNER_TEMP/pages-preview/fountainjs"
          tar -xf "$RUNNER_TEMP/pages-upload/artifact.tar" -C "$RUNNER_TEMP/pages-preview/fountainjs"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Download starters from the archived site
        env:
          FOUNTAIN_PAGES_PREVIEW_ROOT: ${{ runner.temp }}/pages-preview
        run: pnpm exec playwright test --config playwright.pages.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pages-download-diagnostics
          path: artifacts/pages-downloads
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
