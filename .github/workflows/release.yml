name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm dlx publint@0.3.24
      - run: pnpm dlx @arethetypeswrong/cli@0.18.5 --pack . --entrypoints . ./react
      - name: Verify npm trusted publisher
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/verify-npm-trusted-publisher.mjs
      # npm trusted publishing exchanges GitHub's OIDC identity for a
      # short-lived, stage-only credential and attaches provenance automatically.
      # A maintainer must still inspect and approve the stage with npm 2FA.
      - name: Stage package on npm
        if: github.event_name == 'release'
        run: npm stage publish . --access public
